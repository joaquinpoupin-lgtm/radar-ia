# Configuración de Radar IA. Cambiar valores aquí, no en el código.

zona_horaria: America/Santiago

limites:
  max_brief: 10            # ítems máximos en el brief del día
  max_por_dia: 25          # noticias publicadas máximas por día (todas las secciones)
  max_nuevas_por_corrida: 10  # candidatas que se mandan a la IA en cada corrida
  tamano_lote: 10          # noticias por llamada a la IA
  dias_antiguedad_max: 3   # se ignoran candidatos más viejos que esto
  similitud_titulos: 0.8   # 0-1: desde cuánto dos títulos se consideran la misma noticia

prefiltro:
  # Puntaje sin IA para elegir qué se manda a resumir: peso de la fuente (1-3) + bonus - castigo por antigüedad.
  bonus_por_fuente_extra: 1    # por cada fuente adicional que cuenta la misma noticia (máx. +3)
  bonus_hn: {100: 1, 300: 2}   # puntos en Hacker News → bonus (se usa el mayor que se alcance)
  bonus_palabra_clave: 0.5     # si el título tiene alguna palabra clave (una sola vez)
  castigo_por_dia: 0.5         # se resta por cada día de antigüedad
  max_por_fuente: 3            # máximo de una misma fuente por corrida (variedad)
  palabras_clave: [launch, launches, launched, release, releases, released, introducing, announces,
                   model, "open source", open-source, open-weight, free, agent, agents,
                   lanza, lanzamiento, presenta, modelo, gratis, "código abierto", agente, agentes]

cache:
  dias: 30                 # las entradas de procesados.json más viejas que esto se borran

brief:
  hora_desde: "06:00"      # la primera corrida del día después de esta hora arma el brief

ia:
  # Nombres de modelo verificados en el Paso 5 (2026-10-20). Si uno deja de existir,
  # `radar probar-ia` lista los que tu clave sí puede usar.
  # Gemini 2.5 ya no se ofrece a proyectos nuevos; Groq sacó Llama 3.3 del plan gratis (16-08-2026).
  principal:
    proveedor: gemini
    modelo: gemini-3.5-flash-lite
  respaldo:
    proveedor: groq
    modelo: openai/gpt-oss-120b
    # Groq gratis da 8K tokens/min; un lote de 10 noticias gasta ~6K y casi 2K eran "razonamiento".
    opciones: {reasoning_effort: low}
  reintentos: 3            # intentos por proveedor ante 429 / errores temporales
  espera_inicial_seg: 5    # backoff exponencial: 5, 10, 20...
  espera_max_seg: 60       # nunca esperar más que esto entre intentos (aunque el servicio pida más)
  timeout_seg: 60

fuentes:
  dias_aviso_sin_novedades: 90  # `radar fuentes` avisa si una fuente no publica hace más que esto
  hilos: 8                 # cuántas fuentes se prueban a la vez

recolector:
  max_por_fuente: 30       # candidatos máximos que se toman de cada fuente por corrida
  largo_extracto: 500      # caracteres máximos del extracto (nunca se guarda el artículo completo)
  # Hacker News: solo entran historias cuyo título tenga alguna de estas palabras
  # "agent" no va: en HN suele ser otra cosa ("ICE agent"); los de IA casi siempre dicen "AI" o "agentic".
  palabras_ia: [ai, llm, llms, gpt, chatgpt, openai, anthropic, claude, gemini, deepmind,
                llama, mistral, deepseek, qwen, grok, xai, copilot, codex, sora, midjourney,
                ollama, "hugging face", huggingface, "machine learning", "deep learning",
                neural, chatbot, agentic, "artificial intelligence",
                inference, fine-tuning, rag, embeddings, diffusion, "stable diffusion",
                perplexity, "vibe coding", prompt, prompts, nvidia]

red:
  timeout_seg: 20
  user_agent: "RadarIA/0.1 (lector personal de noticias)"
