    seccion: herramientas
    idioma: en
    peso: 3

  - nombre: Microsoft (IA)
    tipo: rss
    url: https://news.microsoft.com/source/topics/ai/feed/
    seccion: modelos
    idioma: en
    peso: 2

  - nombre: NVIDIA
    tipo: rss   # blog general: también trae noticias de videojuegos
    url: https://blogs.nvidia.com/feed/
    seccion: modelos
    idioma: en
    peso: 2

  # --- Comunidad ---
  - nombre: Hacker News
    tipo: hackernews   # el recolector se queda solo con lo que habla de IA
    url: https://hn.algolia.com/api/v1/search_by_date?tags=story&numericFilters=points%3E%3D50&hitsPerPage=100
    seccion: tendencias
    idioma: en
    peso: 2

  - nombre: Reddit
    tipo: rss   # 8 comunidades en un solo pedido: Reddit bloquea si se piden seguidas
    url: https://www.reddit.com/r/LocalLLaMA+artificial+singularity+OpenAI+ClaudeAI+ChatGPT+StableDiffusion+aivideo/top/.rss?t=day&limit=50
    seccion: tendencias
    idioma: en
    peso: 1

  # --- Proyectos, modelos y papers en tendencia (Paso 14) ---
  # Gratis y sin cuenta. Cada una aporta como máximo 1 noticia por corrida (max_por_corrida).
  - nombre: GitHub (en alza)
    tipo: github   # API de búsqueda: repos de IA creados en los últimos 7 días con ≥150 estrellas
    url: https://api.github.com/search/repositories?q=llm+OR+agent+OR+ai+in%3Aname%2Cdescription%2Ctopics+created%3A%3E%3D{desde}+stars%3A%3E%3D150&sort=stars&order=desc&per_page=30
    seccion: herramientas
    idioma: en
    peso: 2
    max_por_corrida: 1

  - nombre: GitHub (skills de Claude)
    tipo: github   # skills para Claude creadas en los últimos 7 días con ≥100 estrellas
    url: https://api.github.com/search/repositories?q=skills+claude+in%3Aname%2Cdescription%2Ctopics+created%3A%3E%3D{desde}+stars%3A%3E%3D100&sort=stars&order=desc&per_page=30
    seccion: skills
    idioma: en
    peso: 2
    max_por_corrida: 1

  - nombre: Hugging Face (modelos)
    tipo: huggingface   # modelos en tendencia publicados en los últimos 7 días (sin copias cuantizadas)
    url: https://huggingface.co/api/models?sort=trendingScore&direction=-1&limit=30
    seccion: modelos
    idioma: en
    peso: 2
    max_por_corrida: 1

