# Fuentes de Radar IA. Agregar o quitar fuentes aquí, sin tocar código.
# Después de editar, correr `python -m radar fuentes` para probarlas.
#
# Campos:
#   nombre   nombre corto que se muestra en la web (único)
#   tipo     rss | hackernews | youtube | github | huggingface | papers
#            (github, huggingface y papers leen la API pública de esos sitios; ver más abajo)
#   url      dirección del feed (o de la API). {desde} se cambia por la fecha de hace
#            `recolector.dias_tendencias` días (config.yaml)
#   seccion  sección por defecto: modelos | herramientas | tendencias | skills | creadores | dinero | tips
#            (la IA puede cambiarla según la noticia)
#   idioma   es | en
#   peso     1 (mucho ruido) a 3 (oficial / muy confiable); cuenta en el pre-filtro
#   activa   false para apagarla sin borrarla (opcional, por defecto true)
#   max_por_corrida  cuántas de esta fuente pueden ir a la IA por corrida (opcional; si no,
#            prefiltro.max_por_fuente de config.yaml). Sirve para que las fuentes con mucho
#            volumen no llenen el brief.
#
# "Feed comunitario": la empresa no publica RSS oficial; lo genera el proyecto
# gratuito github.com/Olshansk/rss-feeds leyendo su página. Si un día deja de
# actualizarse, `radar fuentes` lo marca con AVISO.

fuentes:
  # --- Empresas de IA (oficiales) ---
  - nombre: OpenAI
    tipo: rss
    url: https://openai.com/news/rss.xml
    seccion: modelos
    idioma: en
    peso: 3

  - nombre: Anthropic
    tipo: rss   # feed comunitario
    url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_news.xml
    seccion: modelos
    idioma: en
    peso: 3

  - nombre: Claude (blog)
    tipo: rss   # feed comunitario: blog de producto de Claude (anuncia skills y funciones nuevas)
    url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_claude.xml
    seccion: herramientas
    idioma: en
    peso: 3

  - nombre: Google DeepMind
